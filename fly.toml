[app]
  # Replace with a unique name or omit to let fly choose
  # Example: app = "game-gateway"

[build]
  dockerfile = "deployment/Dockerfile.fly"

[env]
  # Optional defaults. You can override these with fly secrets or 'flyctl secrets set'.
  GAME_SERVICE_HOST = "localhost:8082"
  PURCHASE_SERVICE_HOST = "localhost:8083"
  WISHLIST_SERVICE_HOST = "localhost:8084"
  NOTIFICATION_SERVICE_HOST = "localhost:8085"
  AUTH_SERVICE_HOST = "localhost:8087"
  STORAGE_SERVICE_HOST = "localhost:8086"
