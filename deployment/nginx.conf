# Nginx Configuration - GameSpotlight Reverse Proxy
# Location: /etc/nginx/sites-available/gamespotlight
# Enable with: sudo ln -s /etc/nginx/sites-available/gamespotlight /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Restart: sudo systemctl restart nginx

# Define upstream services
upstream gateway {
    server localhost:8080;
}

upstream auth_service {
    server localhost:8087;
}

upstream game_service {
    server localhost:8082;
}

upstream purchase_service {
    server localhost:8083;
}

upstream wishlist_service {
    server localhost:8084;
}

upstream notification_service {
    server localhost:8086;
}

upstream storage_service {
    server localhost:8085;
}

# Redirect HTTP to HTTPS (uncomment after SSL setup)
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }

# Main HTTP server (port 80)
server {
    listen 80 default_server;
    server_name _;  # Catch-all or replace with yourdomain.com
    
    # Increase request limits for file uploads
    client_max_body_size 1000M;
    
    # Logging
    access_log /var/log/nginx/gamespotlight_access.log;
    error_log /var/log/nginx/gamespotlight_error.log;

    # Gzip compression (improves performance)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_vary on;

    # ============================================================
    # API Gateway (Main entry point for all /api/* requests)
    # ============================================================
    location /api/ {
        proxy_pass http://gateway/api/;
        
        # Headers required for proper routing
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ============================================================
    # Direct Service Routes (Optional - for debugging)
    # ============================================================
    
    location /auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /games/ {
        proxy_pass http://game_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /purchases/ {
        proxy_pass http://purchase_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /wishlist/ {
        proxy_pass http://wishlist_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://storage_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============================================================
    # Health Check Endpoint
    # ============================================================
    location /health {
        proxy_pass http://gateway/actuator/health;
        access_log off;  # Don't log health checks
    }

    location /actuator/ {
        proxy_pass http://gateway/actuator/;
        # Restrict actuator endpoints to local IP only
        allow 127.0.0.1;
        allow 10.0.0.0/8;  # VPC
        deny all;
    }

    # ============================================================
    # Security Headers
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ============================================================
    # CORS Headers (if frontend on different domain)
    # ============================================================
    add_header Access-Control-Allow-Origin "https://yourdomain.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # ============================================================
    # Deny Access to Sensitive Paths
    # ============================================================
    location ~ /admin/ {
        deny all;
        return 403;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.git/ {
        deny all;
    }

    # ============================================================
    # Rate Limiting (prevent abuse)
    # ============================================================
    # Define rate limit zone at http block level (add to /etc/nginx/nginx.conf)
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Then uncomment:
    # limit_req zone=api_limit burst=20 nodelay;

    # ============================================================
    # Root/Home
    # ============================================================
    location / {
        # For backend documentation or redirect to frontend
        return 301 https://yourdomain.com;  # Update to your Vercel URL
    }

    # ============================================================
    # File Upload Endpoint (increase limit for storage service)
    # ============================================================
    location /api/storage/upload {
        proxy_pass http://storage_service/api/storage/upload;
        
        # Allow large file uploads
        client_max_body_size 500M;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Extended timeouts for file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

